version: 1
server:
  host: 127.0.0.1
  port: 8765
storage:
  database: .routebench/routebench.db
  artifacts: .routebench/artifacts
  workspaces: .routebench/workspaces
  keep_workspaces: false
  retention_days: 30
execution:
  mode: sequential
  timeout_seconds: 900
  attempts: 1
  random_seed: 42
  max_concurrency: 2
  max_artifact_bytes: 10485760
  grader_timeout_seconds: 60
suites:
  python-smoke: evals/python-core/suite.yaml#smoke
  python-core: evals/python-core/suite.yaml
  python-planning: evals/python-core/suite.yaml#planning
profiles:
  pi-autorouter:
    label: Pi AutoRouter
    adapter: pi
    model: Auto-3-API
  claude-opus:
    label: Claude Code · Opus
    adapter: claude
    model: claude-opus-5
  claude-sonnet:
    label: Claude Code · Sonnet
    adapter: claude
    model: sonnet
  claude-fable-5:
    label: Claude Code · Fable 5
    adapter: claude
    model: claude-fable-5
  claude-fable-5-1:
    label: Claude Code · Fable 5.1
    adapter: claude
    model: claude-fable-5-1
  codex-gpt6-sol:
    label: Codex · GPT-6-Sol
    adapter: codex
    model: gpt-6-sol
    pricing:
      source: "Pi model catalog · global.openai.gpt-6-sol list price"
      effective_date: "2026-09-23"
      input_per_million: 2
      cached_input_per_million: 0.2
      output_per_million: 10
