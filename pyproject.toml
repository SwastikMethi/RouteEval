[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "routebench"
version = "0.1.0"
description = "Local, evidence-first coding-agent evaluation workbench"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1", "pydantic>=2.10,<3", "PyYAML>=6,<7", "pytest>=8,<10"]

[project.optional-dependencies]
dev = ["httpx>=0.28,<1", "pytest-asyncio>=0.25,<2", "ruff>=0.9,<1"]

[project.scripts]
routebench = "routebench.main:main"

[tool.hatch.build.targets.wheel]
packages = ["backend/routebench"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
